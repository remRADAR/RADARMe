name: Build and deploy Worker

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  build:
    name: Build and test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build production Worker
        run: npm run build

      - name: Verify generated Wrangler bundle
        run: |
          test -s dist/server/index.mjs
          test -s dist/server/wrangler.json
          test -s dist/client/_headers
          node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8")); if (config.main !== "index.mjs") process.exit(1); if (config.assets?.binding !== "ASSETS") process.exit(1); if (config.assets?.directory !== "../client") process.exit(1);'

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Package verified Worker bundle
        run: tar -czf worker-bundle.tar.gz -C dist client server

      - name: Upload verified Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle-${{ github.sha }}
          path: worker-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Download verified Worker bundle
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle

      - name: Extract verified Worker bundle
        run: |
          mkdir -p dist
          tar -xzf bundle/worker-bundle.tar.gz -C dist
          test -s dist/server/index.mjs
          test -s dist/server/wrangler.json
          test -s dist/client/_headers

      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy verified Worker
        run: wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    name: Deploy PR preview Worker
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Download verified Worker bundle
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle-${{ github.sha }}
          path: bundle

      - name: Extract Worker bundle
        run: |
          mkdir -p dist
          tar -xzf bundle/worker-bundle.tar.gz -C dist
          test -s dist/server/index.mjs
          test -s dist/server/wrangler.json
          test -s dist/client/_headers

      - name: Create PR preview configuration
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_CONFIG: ${{ runner.temp }}/wrangler-preview.json
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(
              fs.readFileSync("dist/server/wrangler.json", "utf8")
            );
            config.name = `remradar-radarme-pr-${process.env.PR_NUMBER}`;
            fs.writeFileSync(
              process.env.PREVIEW_CONFIG,
              JSON.stringify(config, null, 2)
            );
          '
          test -s "$PREVIEW_CONFIG"

      - name: Deploy PR preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_CONFIG: ${{ runner.temp }}/wrangler-preview.json
        run: wrangler deploy --config "$PREVIEW_CONFIG" --no-prompts

      - name: Publish preview details
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Cloudflare PR preview"
            echo
            echo "Worker: \\`remradar-radarme-pr-${PR_NUMBER}\\`"
            echo
            echo "This preview is deployed only for pull requests originating from this repository."
            echo "The public hostname or route is controlled by Cloudflare account settings."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete closed PR preview Worker
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install --global wrangler@4.131.1

      - name: Delete PR preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WORKER_NAME="remradar-radarme-pr-${PR_NUMBER}"
          wrangler delete "$WORKER_NAME" --force

      - name: Publish cleanup details
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Cloudflare PR preview cleanup"
            echo
            echo "Deleted Worker: \\`remradar-radarme-pr-${PR_NUMBER}\\`"
          } >> "$GITHUB_STEP_SUMMARY"
